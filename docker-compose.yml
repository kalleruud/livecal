services:
  livecal:
    build: .
    container_name: livecal
    restart: unless-stopped
    ports:
      - "6699:6699"
    environment:
      - PORT=6699
      - HOST=0.0.0.0
      - CACHE_DIR=/app/cache
      - CACHE_CRON=0 * * * *
    volumes:
      - livecal-cache:/app/cache
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:6699/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  livecal-cache:
