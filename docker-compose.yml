services:
  livecal:
    image: ghcr.io/kalleruud/livecal:latest
    container_name: livecal
    restart: unless-stopped
    ports:
      - "6699:${PORT:-6699}"
    env_file:
      - .env
    volumes:
      - livecal-cache:${CACHE_DIR}
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          'bun -e "fetch(''http://localhost:'' + (process.env.PORT || 6699) + ''/health'').then(r => process.exit(r.ok ? 0 : 1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  livecal-cache:
