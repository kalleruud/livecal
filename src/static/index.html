<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livecal</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.6;
      background: #121212;
      color: #e0e0e0;
    }
    h1 { margin-bottom: 0.5rem; }
    p { color: #888; margin-top: 0; }
    ul { list-style: none; padding: 0; }
    li {
      padding: 0.75rem;
      border: 1px solid #333;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }
    .endpoint-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    code {
      background: #1e1e1e;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      flex: 1;
      font-size: 0.9rem;
    }
    a {
      color: #66b3ff;
      text-decoration: none;
      padding: 0.25rem 0.5rem;
      border: 1px solid currentColor;
      border-radius: 4px;
    }
    a:hover { background: #66b3ff; color: #121212; }
    .params {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      font-size: 0.85rem;
    }
    .param {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .param label {
      color: #888;
    }
    select, input[type="text"] {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e0e0e0;
      padding: 0.25rem 0.5rem;
      font-size: 0.85rem;
    }
    input[type="checkbox"] {
      accent-color: #66b3ff;
    }
  </style>
</head>
<body>
  <h1>Livecal</h1>
  <p>Available calendar endpoints</p>
  <ul>
    {{ENDPOINTS}}
  </ul>
  <script>
    document.querySelectorAll('.endpoint').forEach(endpoint => {
      const basePath = endpoint.dataset.path;
      const paramsJson = endpoint.dataset.params;
      const paramsContainer = endpoint.querySelector('.params');
      const link = endpoint.querySelector('.subscribe-link');
      const code = endpoint.querySelector('code');

      // Parse parameter metadata
      const paramMetadata = paramsJson ? JSON.parse(paramsJson) : [];

      // Render input fields based on metadata
      paramMetadata.forEach(param => {
        const paramDiv = document.createElement('div');
        paramDiv.className = 'param';

        switch (param.type) {
          case 'text':
          case 'comma-separated': {
            const label = document.createElement('label');
            label.textContent = param.label;
            const input = document.createElement('input');
            input.type = 'text';
            input.name = param.name;
            input.placeholder = param.placeholder || '';
            if (param.description) input.title = param.description;
            paramDiv.appendChild(label);
            paramDiv.appendChild(input);
            break;
          }

          case 'select': {
            const selectLabel = document.createElement('label');
            selectLabel.textContent = param.label;
            const select = document.createElement('select');
            select.name = param.name;
            param.options?.forEach(opt => {
              const option = document.createElement('option');
              option.value = opt.value;
              option.textContent = opt.label;
              if (opt.value === param.defaultValue) option.selected = true;
              select.appendChild(option);
            });
            if (param.description) select.title = param.description;
            paramDiv.appendChild(selectLabel);
            paramDiv.appendChild(select);
            break;
          }

          case 'checkbox': {
            const checkLabel = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.name = param.name;
            checkbox.checked = param.defaultValue === true;
            checkbox.dataset.default = String(param.defaultValue);
            checkLabel.appendChild(checkbox);
            checkLabel.appendChild(document.createTextNode(` ${param.label}`));
            if (param.description) checkLabel.title = param.description;
            paramDiv.appendChild(checkLabel);
            break;
          }
        }

        paramsContainer.appendChild(paramDiv);
      });

      const inputs = endpoint.querySelectorAll('select, input');

      function updateUrl() {
        const params = new URLSearchParams();
        inputs.forEach(input => {
          if (input.type === 'checkbox') {
            if (input.dataset.default === 'true' && !input.checked) {
              params.set(input.name, 'false');
            } else if (input.dataset.default === 'false' && input.checked) {
              params.set(input.name, 'true');
            }
          } else if (input.value) {
            params.set(input.name, input.value);
          }
        });
        const query = params.toString();
        const fullPath = query ? `${basePath}?${query}` : basePath;
        const webcalUrl = `webcal://${location.host}${fullPath}`;
        link.href = webcalUrl;
        code.textContent = fullPath;
      }

      inputs.forEach(input => {
        input.addEventListener('change', updateUrl);
        input.addEventListener('input', updateUrl);
      });
      updateUrl();
    });
  </script>
</body>
</html>
