<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livecal</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.6;
      background: #121212;
      color: #e0e0e0;
    }
    h1 { margin-bottom: 0.5rem; }
    p { color: #888; margin-top: 0; }
    ul { list-style: none; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem;
      border: 1px solid #333;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }
    code {
      background: #1e1e1e;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      flex: 1;
    }
    a {
      color: #66b3ff;
      text-decoration: none;
      padding: 0.25rem 0.5rem;
      border: 1px solid currentColor;
      border-radius: 4px;
    }
    a:hover { background: #66b3ff; color: #121212; }
  </style>
</head>
<body>
  <h1>Livecal</h1>
  <p>Available calendar endpoints</p>
  <ul>
    {{ENDPOINTS}}
  </ul>
</body>
</html>
