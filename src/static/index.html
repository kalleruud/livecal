<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Livecal</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.6;
        background: #121212;
        color: #e0e0e0;
      }
      h1 {
        margin-bottom: 0.5rem;
      }
      p {
        color: #888;
        margin-top: 0;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        padding: 0.75rem;
        border: 1px solid #333;
        border-radius: 4px;
        margin-bottom: 0.5rem;
      }
      .endpoint-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 0.75rem;
        min-width: 0;
      }
      code {
        background: #1e1e1e;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        flex: 1;
        font-size: 0.9rem;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
      }
      a {
        color: #66b3ff;
        text-decoration: none;
        padding: 0.25rem 0.5rem;
        border: 1px solid currentColor;
        border-radius: 4px;
      }
      .subscribe-link {
        flex-shrink: 0;
      }
      a:hover {
        background: #66b3ff;
        color: #121212;
      }
      .params {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
        font-size: 0.85rem;
      }
      .param {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .param label {
        color: #888;
      }
      select,
      input[type='text']:not(.multi-select-input) {
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 4px;
        color: #e0e0e0;
        padding: 0.25rem 0.5rem;
        font-size: 0.85rem;
      }
      input[type='checkbox'] {
        accent-color: #66b3ff;
      }
      .multi-select-container {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        flex: 1;
        position: relative;
      }
      .multi-select-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        min-height: 1.5rem;
        max-height: 6rem;
        align-items: center;
        align-content: flex-start;
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 4px;
        padding: 0.25rem 0.5rem;
        cursor: text;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .multi-select-chips.focused {
        border-color: #66b3ff;
      }
      .chip {
        background: #66b3ff;
        color: #121212;
        padding: 0.25rem 0.5rem;
        border-radius: 3px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.75rem;
        cursor: pointer;
      }
      .chip-close {
        font-weight: bold;
        opacity: 0.7;
        pointer-events: none;
      }
      .chip:hover .chip-close {
        opacity: 1;
      }
      .multi-select-input {
        background: transparent;
        border: none;
        color: #e0e0e0;
        font-size: 0.85rem;
        outline: none;
        flex: 1;
        min-width: 100px;
        padding: 0;
      }
      .multi-select-dropdown {
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 4px;
        max-height: 300px;
        overflow-y: auto;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        width: 100%;
        z-index: 1000;
        margin-top: 0.25rem;
      }
      .multi-select-option {
        padding: 0.5rem;
        cursor: pointer;
        color: #e0e0e0;
        font-size: 0.85rem;
      }
      .multi-select-option:hover {
        background: #333;
      }
      .multi-select-option.active {
        outline: 2px solid #e0e0e0;
        outline-offset: -2px;
      }
      .multi-select-option.selected {
        background: #66b3ff;
        color: #121212;
      }
      .multi-select-loading {
        padding: 0.5rem;
        color: #888;
        font-size: 0.85rem;
        text-align: center;
      }
      .multi-select-error {
        padding: 0.5rem;
        color: #ff6b6b;
        font-size: 0.85rem;
        text-align: center;
      }
      .multi-select-empty {
        padding: 0.5rem;
        color: #888;
        font-size: 0.85rem;
        text-align: center;
      }
      .param-relative {
        position: relative;
      }
    </style>
  </head>
  <body>
    <h1>Livecal</h1>
    <p>Available calendar endpoints</p>
    <ul>
      {{ENDPOINTS}}
    </ul>
    <script type="module">
      import {
        getNextOptionIndex,
        getRenderedOptionIndex,
        replaceChipsPreservingInput,
        toggleSelectedValue,
      } from '/static/multi-select.js'

      let multiSelectCount = 0

      document.querySelectorAll('.endpoint').forEach(endpoint => {
        const basePath = endpoint.dataset.path
        const paramsJson = endpoint.dataset.params
        const paramsContainer = endpoint.querySelector('.params')
        const link = endpoint.querySelector('.subscribe-link')
        const code = endpoint.querySelector('code')

        // Parse parameter metadata
        const paramMetadata = paramsJson ? JSON.parse(paramsJson) : []

        // Render input fields based on metadata
        const multiSelectInstances = new Map()

        paramMetadata.forEach(param => {
          const paramDiv = document.createElement('div')
          paramDiv.className = 'param'

          switch (param.type) {
            case 'text':
            case 'comma-separated': {
              const label = document.createElement('label')
              label.textContent = param.label
              const input = document.createElement('input')
              input.type = 'text'
              input.name = param.name
              input.placeholder = param.placeholder || ''
              if (param.description) input.title = param.description
              paramDiv.appendChild(label)
              paramDiv.appendChild(input)
              break
            }

            case 'select': {
              const selectLabel = document.createElement('label')
              selectLabel.textContent = param.label
              const select = document.createElement('select')
              select.name = param.name
              param.options?.forEach(opt => {
                const option = document.createElement('option')
                option.value = opt.value
                option.textContent = opt.label
                if (opt.value === param.defaultValue) option.selected = true
                select.appendChild(option)
              })
              if (param.description) select.title = param.description
              paramDiv.appendChild(selectLabel)
              paramDiv.appendChild(select)
              break
            }

            case 'checkbox': {
              const checkLabel = document.createElement('label')
              const checkbox = document.createElement('input')
              checkbox.type = 'checkbox'
              checkbox.name = param.name
              checkbox.checked = param.defaultValue === true
              checkbox.dataset.default = String(param.defaultValue)
              checkLabel.appendChild(checkbox)
              checkLabel.appendChild(document.createTextNode(` ${param.label}`))
              if (param.description) checkLabel.title = param.description
              paramDiv.appendChild(checkLabel)
              break
            }

            case 'multi-select-dynamic': {
              paramDiv.className = 'param param-relative'
              const label = document.createElement('label')
              label.textContent = param.label

              const container = document.createElement('div')
              container.className = 'multi-select-container'

              const chipsContainer = document.createElement('div')
              chipsContainer.className = 'multi-select-chips'

              const hiddenInput = document.createElement('input')
              hiddenInput.type = 'hidden'
              hiddenInput.name = param.name

              const searchInput = document.createElement('input')
              searchInput.type = 'text'
              searchInput.className = 'multi-select-input'
              searchInput.placeholder = param.placeholder || 'Search...'
              searchInput.setAttribute('role', 'combobox')
              searchInput.setAttribute('aria-autocomplete', 'list')
              searchInput.setAttribute('aria-expanded', 'false')
              if (param.description) searchInput.title = param.description

              const dropdown = document.createElement('div')
              dropdown.className = 'multi-select-dropdown'
              dropdown.style.display = 'none'
              dropdown.setAttribute('role', 'listbox')
              dropdown.setAttribute('aria-multiselectable', 'true')

              const componentId = `multi-select-${multiSelectCount++}`
              dropdown.id = `${componentId}-listbox`
              searchInput.setAttribute('aria-controls', dropdown.id)

              const selectedValues = new Set()
              let allOptions = []
              let filteredOptions = []
              let activeOptionIndex = -1
              let lastDependencyValue = null

              // biome-ignore lint/correctness/noInnerDeclarations: Functions need access to closure variables
              async function fetchOptions() {
                const dependencyField = param.dependsOn
                  ? endpoint.querySelector(`[name="${param.dependsOn}"]`)
                  : null

                const dependencyValue = dependencyField
                  ? dependencyField.value
                  : null

                // Only refetch if dependency changed
                if (
                  dependencyValue === lastDependencyValue &&
                  allOptions.length > 0
                ) {
                  return
                }

                if (!dependencyValue) {
                  dropdown.innerHTML = `<div class="multi-select-empty">Select ${param.dependsOn || 'a filter'} first</div>`
                  allOptions = []
                  return
                }

                lastDependencyValue = dependencyValue
                dropdown.innerHTML =
                  '<div class="multi-select-loading">Loading...</div>'

                try {
                  const endpoint = `${param.optionsEndpoint}&${param.dependsOn}=${encodeURIComponent(dependencyValue)}`
                  const response = await fetch(endpoint)

                  if (!response.ok) {
                    throw new Error('Failed to fetch options')
                  }

                  const data = await response.json()
                  allOptions = data.options || []

                  // Clear selections when dependency changes
                  selectedValues.clear()
                  hiddenInput.value = ''
                  renderChips()
                  updateUrl()

                  renderDropdown('')
                } catch (_error) {
                  dropdown.innerHTML =
                    '<div class="multi-select-error">Error loading options</div>'
                  allOptions = []
                }
              }

              // biome-ignore lint/correctness/noInnerDeclarations: Functions need access to closure variables
              function filterOptions(searchTerm) {
                const term = searchTerm.toLowerCase()
                return allOptions.filter(opt =>
                  opt.label.toLowerCase().includes(term)
                )
              }

              // biome-ignore lint/correctness/noInnerDeclarations: Functions need access to closure variables
              function updateActiveOption() {
                const optionElements = dropdown.querySelectorAll(
                  '.multi-select-option'
                )
                optionElements.forEach(option =>
                  option.classList.remove('active')
                )

                const activeOption = optionElements[activeOptionIndex]
                if (!activeOption) {
                  searchInput.removeAttribute('aria-activedescendant')
                  return
                }

                activeOption.classList.add('active')
                searchInput.setAttribute(
                  'aria-activedescendant',
                  activeOption.id
                )
                activeOption.scrollIntoView({ block: 'nearest' })
              }

              // biome-ignore lint/correctness/noInnerDeclarations: Functions need access to closure variables
              function toggleOption(opt) {
                toggleSelectedValue(selectedValues, opt.value)
                hiddenInput.value = Array.from(selectedValues).join(',')
                renderChips()
                renderDropdown(searchInput.value, false)
                updateUrl()
              }

              // biome-ignore lint/correctness/noInnerDeclarations: Functions need access to closure variables
              function renderDropdown(searchTerm, resetActive = true) {
                filteredOptions = filterOptions(searchTerm)
                dropdown.innerHTML = ''

                activeOptionIndex = getRenderedOptionIndex(
                  activeOptionIndex,
                  filteredOptions.length,
                  resetActive
                )

                if (filteredOptions.length === 0) {
                  dropdown.innerHTML =
                    '<div class="multi-select-empty">No options found</div>'
                } else {
                  filteredOptions.forEach((opt, index) => {
                    const optionEl = document.createElement('div')
                    optionEl.className = 'multi-select-option'
                    optionEl.id = `${componentId}-option-${index}`
                    optionEl.setAttribute('role', 'option')
                    optionEl.setAttribute(
                      'aria-selected',
                      String(selectedValues.has(opt.value))
                    )
                    if (selectedValues.has(opt.value)) {
                      optionEl.classList.add('selected')
                    }
                    optionEl.textContent = opt.label
                    optionEl.addEventListener('click', () => {
                      activeOptionIndex = index
                      toggleOption(opt)
                      searchInput.focus()
                    })
                    dropdown.appendChild(optionEl)
                  })
                }

                updateActiveOption()
              }

              // biome-ignore lint/correctness/noInnerDeclarations: Functions need access to closure variables
              function renderChips() {
                const chipsContent = Array.from(selectedValues).map(value => {
                  const chipEl = document.createElement('div')
                  chipEl.className = 'chip'
                  chipEl.title = `Remove ${value}`
                  chipEl.innerHTML = `${value}<span class="chip-close">×</span>`
                  chipEl.addEventListener('mousedown', e => e.preventDefault())
                  chipEl.addEventListener('click', e => {
                    e.stopPropagation()
                    toggleSelectedValue(selectedValues, value)
                    hiddenInput.value = Array.from(selectedValues).join(',')
                    renderChips()
                    renderDropdown(searchInput.value, false)
                    updateUrl()
                    searchInput.focus()
                  })
                  return chipEl
                })

                replaceChipsPreservingInput(
                  chipsContainer,
                  searchInput,
                  chipsContent
                )
              }

              chipsContainer.addEventListener('click', () => {
                searchInput.focus()
              })

              searchInput.addEventListener('focus', async () => {
                await fetchOptions()
                dropdown.style.display = 'block'
                chipsContainer.classList.add('focused')
                searchInput.setAttribute('aria-expanded', 'true')
              })

              searchInput.addEventListener('blur', () => {
                setTimeout(() => {
                  if (document.activeElement === searchInput) return

                  dropdown.style.display = 'none'
                  chipsContainer.classList.remove('focused')
                  searchInput.setAttribute('aria-expanded', 'false')
                  searchInput.removeAttribute('aria-activedescendant')
                  searchInput.value = ''
                  renderDropdown('')
                }, 200)
              })

              dropdown.addEventListener('mousedown', event => {
                event.preventDefault()
              })

              searchInput.addEventListener('input', e => {
                renderDropdown(e.target.value)
              })

              searchInput.addEventListener('keydown', event => {
                if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                  event.preventDefault()
                  activeOptionIndex = getNextOptionIndex(
                    activeOptionIndex,
                    filteredOptions.length,
                    event.key === 'ArrowDown' ? 1 : -1
                  )
                  updateActiveOption()
                  return
                }

                if (event.key === 'Enter' && activeOptionIndex >= 0) {
                  event.preventDefault()
                  toggleOption(filteredOptions[activeOptionIndex])
                }
              })

              // Fetch options when dependency changes
              if (param.dependsOn) {
                setTimeout(() => {
                  const dependencyField = endpoint.querySelector(
                    `[name="${param.dependsOn}"]`
                  )
                  if (dependencyField) {
                    // Fetch initially if dependency has a value
                    if (dependencyField.value) {
                      fetchOptions()
                    }

                    dependencyField.addEventListener('change', () => {
                      selectedValues.clear()
                      hiddenInput.value = ''
                      renderChips()
                      updateUrl()
                      fetchOptions()
                    })
                  }
                }, 0)
              }

              container.appendChild(chipsContainer)
              container.appendChild(dropdown)
              chipsContainer.appendChild(searchInput)

              paramDiv.appendChild(label)
              paramDiv.appendChild(container)
              paramDiv.appendChild(hiddenInput)

              multiSelectInstances.set(param.name, {
                fetchOptions,
                selectedValues,
                hiddenInput,
              })

              break
            }
          }

          paramsContainer.appendChild(paramDiv)
        })

        const inputs = endpoint.querySelectorAll('select, input')

        function updateUrl() {
          const params = new URLSearchParams()
          inputs.forEach(input => {
            if (input.type === 'checkbox') {
              if (input.dataset.default === 'true' && !input.checked) {
                params.set(input.name, 'false')
              } else if (input.dataset.default === 'false' && input.checked) {
                params.set(input.name, 'true')
              }
            } else if (input.value) {
              params.set(input.name, input.value)
            }
          })
          const query = params.toString()
          const fullPath = query ? `${basePath}?${query}` : basePath
          const webcalUrl = `webcal://${location.host}${fullPath}`
          link.href = webcalUrl
          code.textContent = fullPath
        }

        inputs.forEach(input => {
          input.addEventListener('change', updateUrl)
          input.addEventListener('input', updateUrl)
        })
        updateUrl()
      })
    </script>
  </body>
</html>
